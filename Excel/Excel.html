<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Video</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; overflow:hidden; background:#000; }
        video {
            width:100vw; height:100vh; object-fit:cover;
        }
        .start-screen {
            position: fixed; inset:0; background:rgba(0,0,0,0.85);
            display:flex; flex-direction:column; align-items:center;
            justify-content:center; color:#fff; font-family:system-ui,sans-serif;
            gap:24px; font-size:1.4rem; text-align:center; z-index:10;
        }
        .play-btn {
            background:#217346; color:white; border:none; padding:16px 40px;
            font-size:1.3rem; border-radius:12px; cursor:pointer;
            box-shadow:0 8px 20px rgba(0,0,0,0.5);
        }
        .play-btn:active { transform:scale(0.95); }
    </style>
</head>
<body>

    <!-- Start screen – forces user interaction so sound is allowed -->
    <div class="start-screen" id="startScreen">
        <div>اضغط لتشغيل الفيديو بصوت</div>
        <button class="play-btn" id="playButton">تشغيل الفيديو</button>
    </div>

    <video id="myVideo" playsinline>
        <!-- Change to .mp4 with sound (this works everywhere) -->
        <source src="resources/ex.mp4" type="video/mp4">
        <!-- Keep .mov as fallback only for Safari -->
        <source src="resources/ex.mp4" type="video/quicktime">
        Your browser does not support video.
    </video>

    <script>
        const video = document.getElementById('myVideo');
        const startScreen = document.getElementById('startScreen');
        const playButton = document.getElementById('playButton');

        playButton.onclick = () => {
            startScreen.style.display = 'none';
            video.muted = false;           // sound ON
            video.play();

            // When video ends → go back
            video.onended = () => {
                history.back();
            };
        };

        // If video fails to load
        video.onerror = () => {
            alert("فشل تحميل الفيديو");
            history.back();
        };
    </script>
</body>
</html>
