    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel</title>
    <style>
        :root{
          --bg: rgb(49,49,49);
          --text: #ffffff;
          /* Word 2019/365 blue */
          --primary: #2B579A;
          --accent-bg: rgba(43,87,154,0.06);
          --border: #2B579A;
          --card-shadow: 0 8px 20px rgba(43,87,154,0.15);
          --card-shadow-hover: 0 12px 28px rgba(43,87,154,0.25);
          --title-shadow: 0 2px 4px rgba(0,0,0,0.6);
          --link-shadow: 0 1px 0 rgba(0,0,0,0.3);
          --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-stack);
        }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow: hidden; /* Prevent scrolling */
        }
        .container{
            background-color: var(--bg);
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; /* Remove padding for full-screen video */
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Scales to max device resolution without distortion */
            background: black; /* Fallback for loading */
        }
        .no-video {
            color: var(--primary);
            font-weight: 700;
            text-shadow: var(--title-shadow);
            text-align: center;
            padding: 20px;
        }
        @media (max-width: 480px) {
            .container { padding: 0; }
            .no-video { font-size: 1.25rem; }
        }
        @media (min-width: 481px) and (max-width: 900px) {
            .no-video { font-size: 1.03rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="videoPlayer" autoplay controls playsinline></video>
        <div id="noVideoMessage" class="no-video" style="display: none;">No video specified. Please go back and select one.</div>
    </div>
    <script>
        // Get video from URL parameter (e.g., ?video=p1.mp4)
        const urlParams = new URLSearchParams(window.location.search);
        const videoSrc = urlParams.get('video');

        const videoElement = document.getElementById('videoPlayer');
        const noVideoMessage = document.getElementById('noVideoMessage');

        if (videoSrc) {
            videoElement.src = videoSrc;
            // When video ends, go back to previous page
            videoElement.addEventListener('ended', () => {
                history.back();
            });
        } else {
            videoElement.style.display = 'none';
            noVideoMessage.style.display = 'block';
        }
    </script>
</body>
</html>
