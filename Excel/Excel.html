<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Video</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; overflow:hidden; background:#000; }
        video { width:100vw; height:100vh; object-fit:cover; }

        /* Invisible button to unlock audio */
        #fakePlayButton { position:fixed; top:-9999px; opacity:0; pointer-events:none; }

        .loading {
            position:fixed; inset:0; background:rgba(0,0,0,0.95);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            color:#fff; font-family:system-ui,sans-serif; font-size:1.4rem; z-index:99; gap:30px;
        }
        .progress-container {
            width:80%; max-width:400px; height:10px; background:#333; border-radius:5px; overflow:hidden;
        }
        .progress-bar {
            height:100%; width:0%; background:#217346; transition:width 0.3s ease;
        }
        .spinner {
            border:6px solid #333; border-top:6px solid #fff;
            border-radius:50%; width:50px; height:50px; animation:spin 1s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>

    <button id="fakePlayButton" aria-hidden="true"></button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="progressText">جاري التحميل... 0%</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <video id="myVideo" playsinline preload="auto" muted></video>

    <script>
        const video = document.getElementById('myVideo');
        const loading = document.getElementById('loading');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const fakeBtn = document.getElementById('fakePlayButton');

        // Set the video source (you can keep both if you want)
        video.src = "resources/ex.mp4";  // ← one line is cleaner and works everywhere
        video.load();

        let hasStartedPlaying = false;

        const updateProgress = () => {
            if (video.buffered.length === 0) return;

            const bufferedEnd = video.buffered.end(video.buffered.length - 1);
            const duration = video.duration;

            if (duration > 0) {
                const percent = Math.floor((bufferedEnd / duration) * 100);
                progressBar.style.width = percent + '%';
                progressText.textContent = `جاري التحميل... ${percent}%`;

                // Only start when 100% is fully buffered
                if (percent >= 100 && !hasStartedPlaying) {
                    hasStartedPlaying = true;
                    startVideo();
                }
            }
        };

        const startVideo = () => {
            // Unlock audio with fake user gesture
            fakeBtn.click();

            video.muted = false;
            video.play().then(() => {
                loading.style.opacity = '0';
                setTimeout(() => loading.style.display = 'none', 500);
            }).catch(err => console.error("Play failed:", err));
        };

        // Multiple events to catch buffering progress accurately
        video.addEventListener('progress', updateProgress);
        video.addEventListener('loadedmetadata', updateProgress);
        video.addEventListener('canplaythrough', updateProgress);
        video.addEventListener('load', updateProgress);

        // Fallback polling (very important for some browsers/mobile)
        const checkInterval = setInterval(() => {
            if (hasStartedPlaying) {
                clearInterval(checkInterval);
                return;
            }
            updateProgress();
        }, 300);

        // When video ends → go back
        video.onended = () => history.back();

        // Error
        video.onerror = () => {
            alert("فشل تحميل الفيديو");
            history.back();
        };
    </script>
</body>
</html>
