<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Video</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; overflow:hidden; background:#000; }
        video {
            width:100vw; height:100vh; object-fit:cover;
        }
        /* نخفي الزر تمامًا لكن نتركه موجود عشان نضغط عليه برمجيًا */
        #fakePlayButton {
            position:fixed; top:-9999px; left:-9999px; opacity:0;
        }
        .loading {
            position:fixed; inset:0; background:rgba(0,0,0,0.9);
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-family:system-ui; font-size:1.4rem; z-index:99;
        }
        .spinner {
            border:5px solid #333; border-top:5px solid #fff;
            border-radius:50%; width:50px; height:50px;
            animation:spin 1s linear infinite; margin-left:20px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>

    <!-- زر وهمي مخفي تمامًا (مطلوب للسماح بالصوت) -->
    <button id="fakePlayButton"></button>

    <!-- شاشة تحميل بسيطة تختفي لما الفيديو يجهز -->
    <div class="loading" id="loading">جاري التحميل <div class="spinner"></div></div>

    <video id="myVideo" playsinline preload="auto">
        <source src="resources/ex.mp4" type="video/mp4">
        <source src="resources/ex.mp4" type="video/quicktime">
    </video>

    <script>
        const video = document.getElementById('myVideo');
        const loading = document.getElementById('loading');
        const fakeBtn = document.getElementById('fakePlayButton');

        // نحمل الفيديو من أول لحظة
        video.load();

        // لما يجهز الفيديو بما فيه الكفاية → نشغّل تلقائي
        video.addEventListener('canplaythrough', () => {
            // نضغط الزر الوهمي برمجيًا عشان يسمح الصوت
            fakeBtn.click();

            video.muted = false;
            video.play().then(() => {
                loading.style.display = 'none';  // نطفي شاشة التحميل
            }).catch(() => {});
        }, { once: true });

        // إذا انتهى الفيديو → نرجع للخلف (أو نعيد تشغيله حسب رغبتك)
        video.onended = () => {
            history.back();
            // أو video.play(); لو تبغاه يعيد نفسه
        };

        // في حال فشل التحميل
        video.onerror = () => {
            alert("فشل تحميل الفيديو");
            history.back();
        };
    </script>
</body>
</html>
