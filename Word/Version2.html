                <meta charset="UTF-8">

                <title>Word-Version2</title>
                <style>
                                :root{
                                        --bg: rgb(49,49,49);
                                        --text: #ffffff;

                                        /* Excel green → Word blue */
                                        --primary: #2B579A;
                                        --accent-bg: rgba(43,87,154,0.06);
                                        --border: #2B579A;

                                        /* Shadows recolored to Word blue tone */
                                        --card-shadow: 0 8px 20px rgba(43,87,154,0.15);
                                        --card-shadow-hover: 0 12px 28px rgba(43,87,154,0.25);

                                        --title-shadow: 0 2px 4px rgba(0,0,0,0.6);
                                        --link-shadow: 0 1px 0 rgba(0,0,0,0.3);

                                        --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
                                }

                                *{
                                                margin: 0;
                                                padding: 0;
                                                box-sizing: border-box;
                                                font-family: var(--font-stack);
                                }
                                html, body {
                                                height: 100%;
                                                background: var(--bg);
                                                color: var(--text);
                                                -webkit-font-smoothing: antialiased;
                                }
                                .container{
                                                background-color: var(--bg);
                                                min-height: 100vh;
                                                width: 100%;
                                                padding: 40px 16px;
                                }
                                h1{
                                                color: var(--primary);
                                                font-weight: 700;
                                                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                                                margin: 30px 0;
                                                text-align: center;
                                                text-shadow: var(--title-shadow);
                                }
                                .choice{
                                                width: 60%;
                                                max-width: 420px;
                                                padding: 16px;
                                                border: 2px solid var(--border);
                                                border-radius: 8px;
                                                margin: 20px auto;
                                                background: var(--accent-bg);
                                                box-shadow: var(--card-shadow);
                                                transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
                                }
                                .choice:hover{
                                                transform: translateY(-4px);
                                                box-shadow: var(--card-shadow-hover);
                                                opacity: .98;
                                }
                                .choice a{
                                                display: block;
                                                color: var(--primary);
                                                text-decoration: none;
                                                text-align: center;
                                                font-weight: 700;
                                                font-size: 1rem;
                                                padding: 6px 0;
                                                text-shadow: var(--link-shadow);
                                }

                </style>
</head>
