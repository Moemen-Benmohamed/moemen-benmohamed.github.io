                <meta charset="UTF-8">

                <title>Word-Version1</title>
                <style>
                                :root {
                                        --bg: rgb(49,49,49);
                                        --text: #ffffff;
                                        --primary: #2B579A;
                                        --accent-bg: rgba(43,87,154,0.06);
                                        --border: #2B579A;
                                        --card-shadow: 0 8px 20px rgba(43,87,154,0.15);
                                        --card-shadow-hover: 0 12px 28px rgba(43,87,154,0.25);
                                        --title-shadow: 0 2px 4px rgba(0,0,0,0.6);
                                        --link-shadow: 0 1px 0 rgba(0,0,0,0.3);
                                        --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
                                }
                                *, *::before, *::after {
                                                box-sizing: border-box;
                                }
                                html, body {
                                                height: 100%;
                                                margin: 0;
                                                padding: 0;
                                                background: var(--bg);
                                                color: var(--text);
                                                font-family: var(--font-stack);
                                                -webkit-font-smoothing: antialiased;
                                }
                                body {
                                                min-height: 100vh;
                                                display: flex;
                                                align-items: center;
                                                justify-content: center;
                                                padding: 24px;
                                }
                                .container {
                                                width: 100%;
                                                max-width: 680px;
                                                text-align: center;
                                }
                                h1 {
                                                margin: 0 0 40px;
                                                font-size: 1.5rem;
                                                font-weight: 700;
                                                color: var(--primary);
                                                text-shadow: var(--title-shadow);
                                                direction: rtl;
                                }
                                .choices {
                                                width: min(420px, 92%);
                                                margin: 0 auto;
                                                display: flex;
                                                flex-direction: column;
                                                gap: 16px;
                                }
                                .choice {
                                                display: flex;
                                                align-items: center;
                                                justify-content: center;
                                                padding: 16px;
                                                min-height: 56px;
                                                border: 2px solid var(--border);
                                                border-radius: 8px;
                                                background: var(--accent-bg);
                                                box-shadow: var(--card-shadow);
                                                text-decoration: none;
                                                transition: transform 150ms ease, box-shadow 150ms ease, opacity 150ms ease;
                                                -webkit-tap-highlight-color: transparent;
                                }
                                .choice a {
                                                display: block;
                                                color: var(--primary);
                                                text-decoration: none;
                                                font-weight: 700;
                                                font-size: 1.1rem;
                                                text-shadow: var(--link-shadow);
                                }
                                .choice:hover, .choice:focus {
                                                transform: translateY(-4px);
                                                box-shadow: var(--card-shadow-hover);
                                                opacity: 0.98;
                                }
                                .choice:active {
                                                transform: translateY(-2px);
                                }
                                @media (max-width: 480px) {
                                                h1 { font-size: 1.25rem; }
                                                .choice { padding: 12px; min-height: 48px; }
                                                .choice a { font-size: 1rem; }
                                }
                </style>
</head>
<body>

                                                <div class="choice"><a href="resources/version1/Excursion/Excursion.html">Excursion</a></div>
                                </div>
                </div>
</body>
