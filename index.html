<!doctype html>
<html lang="ar">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>اختر التطبيق المطلوب</title>
    <style>
        /* global resets & theme */
        *,*::before,*::after{box-sizing:border-box}
        html,body{height:100%;margin:0;padding:0;background: rgb(49,49,49); color:#fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; -webkit-font-smoothing:antialiased}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
        .container{width:100%;max-width:680px;text-align:center}

        h1{margin:0 0 18px;font-size:1.25rem;font-weight:700;direction:rtl}

        /* apps wrapper */
        .apps{
            width: min(420px, 92%);
            margin: 12px auto 40px;
            display:flex;
            flex-direction:column;
            gap:14px;
        }

        /* app button */
        .app{
            display:flex;
            align-items:center;
            justify-content:space-between; /* label one side, icon the other */
            gap:12px;
            padding:12px 14px;
            min-height:54px; /* comfortable touch target */
            border:2px solid rgba(255,255,255,0.08);
            border-radius:8px;
            text-decoration:none;
            background: rgba(255,255,255,0.02);
            box-shadow:0 6px 18px rgba(0,0,0,0.35);
            transition: transform 150ms ease, box-shadow 150ms ease, opacity 150ms ease, border-color 150ms;
            direction:rtl; /* keep natural RTL reading, icon sits after text */
            -webkit-tap-highlight-color: transparent;
        }
        .app:focus-visible{ outline: none; box-shadow: 0 0 0 4px rgba(255,255,255,0.04), 0 8px 20px rgba(0,0,0,0.45) }
        .app:active{ transform: translateY(-1px) }

        .app .label{
            white-space:nowrap;
            font-weight:700;
            font-size:1rem;
            flex:1;
            text-align:right; /* readable in RTL */
        }
        .app .icon{
            flex:0 0 auto;
            width:20px;
            height:20px;
            border-radius:3px;
            display:inline-block;
        }

        /* application specific color for label and accent shadow */
        .app-word{
            border-color:#2B579A;
            box-shadow: 0 8px 20px rgba(43,87,154,0.18);
        }
        .app-word .label{ color:#2B579A; text-shadow:0 1px 0 rgba(0,0,0,0.45) }

        .app-excel{
            border-color:#217346;
            box-shadow: 0 8px 20px rgba(33,115,70,0.18);
        }
        .app-excel .label{ color:#217346; text-shadow:0 1px 0 rgba(0,0,0,0.45) }

        .app-ppt{
            border-color:#D24726;
            box-shadow: 0 8px 20px rgba(210,71,38,0.18);
        }
        .app-ppt .label{ color:#D24726; text-shadow:0 1px 0 rgba(0,0,0,0.45) }

        /* hover/focus states */
        .app:hover, .app:focus{ transform: translateY(-4px); opacity:0.98; text-decoration:none; }

        /* responsive tweaks */
        @media (max-width:480px){
            .apps{ width: 92% }
            .app{ padding:10px; font-size:0.95rem; border-radius:7px }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>اختر التطبيق المطلوب</h1>

        <div class="apps">
            <a class="app app-word" href="Word/Word.html" role="button" aria-label="Microsoft Word">
                <span class="label">Microsoft Word</span>
                <!-- Word icon (small) -->
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="2" y="3" width="20" height="18" rx="2" fill="#2B579A"/>
                    <path d="M7 7h2.5L11 12l1.5-5H15l-2.5 8L15 19H12l-1.5-5L9 19H7l1.5-6L7 7z" fill="#fff"/>
                </svg>
            </a>

            <a class="app app-excel" href="Excel/Excel.html" role="button" aria-label="Microsoft Excel">
                <span class="label">Microsoft Excel</span>
                <!-- Excel icon (small) -->
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="2" y="3" width="20" height="18" rx="2" fill="#217346"/>
                    <path d="M8 7h2.5L12 9.5 13.5 7H16l-2.5 3L16 13H13.5L12 10.5 10.5 13H8l2.5-3L8 7z" fill="#fff"/>
                </svg>
            </a>

            <a class="app app-ppt" href="powerpoint.html" role="button" aria-label="Microsoft PowerPoint">
                <span class="label">Microsoft PowerPoint</span>
                <!-- PowerPoint icon (small) -->
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="2" y="3" width="20" height="18" rx="2" fill="#D24726"/>
                    <path d="M8 7h4a3 3 0 010 6H8V7zm6 0h2v8h-2V7z" fill="#fff"/>
                </svg>
            </a>
        </div>
    </div>
</body>
</html>
